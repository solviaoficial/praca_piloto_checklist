      --paper:#fff9f0; --paper-deep:#f8ebd7; --muted:#81746a; --line:#e9d9c3;
      --shadow:0 16px 45px rgba(26,9,5,.065); --r:18px;
      --body:'DM Sans',Arial,sans-serif; --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0; color:var(--ink);background:var(--cream);font-family:var(--body);font-size:14px;-webkit-font-smoothing:antialiased}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}button:disabled{cursor:not-allowed}
    button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
    a{color:inherit} svg{display:block;flex-shrink:0}
    .app{min-height:100vh;display:flex}
    .sidebar{width:248px;flex:0 0 248px;min-height:100vh;background:var(--ink);color:var(--cream);display:flex;flex-direction:column;padding:31px 19px 24px;position:sticky;top:0;height:100vh;z-index:10;overflow:hidden}
    .sidebar:before{content:'';width:235px;height:310px;position:absolute;bottom:-70px;right:-165px;background:var(--lupulo) no-repeat center/contain;opacity:.10;transform:rotate(180deg);pointer-events:none}
    .brand-area{border-bottom:1px solid rgba(255,240,222,.15);padding:5px 15px 24px}
    .brand-logo{width:168px;max-width:100%;height:auto;display:block;margin:auto}
    .brand-sub{display:flex;align-items:center;gap:9px;font-size:9px;text-transform:uppercase;letter-spacing:.17em;color:var(--gold);font-weight:800;margin-top:10px;white-space:nowrap}
    .brand-sub:before,.brand-sub:after{content:'';height:1px;background:rgba(199,173,112,.43);flex:1}
    .nav-label{font-weight:800;color:#ac9685;letter-spacing:.17em;font-size:10px;text-transform:uppercase;padding:27px 16px 11px}
    .nav-list{display:flex;flex-direction:column;gap:5px}
    .nav-btn{border:0;background:transparent;color:#c7b8aa;border-radius:11px;display:flex;align-items:center;gap:12px;width:100%;padding:13px 15px;text-align:left;font-size:13px;font-weight:700;transition:background .18s,color .18s}
    .nav-btn svg{width:18px;height:18px}.nav-btn:hover{background:rgba(255,240,222,.07);color:white}
    .nav-btn.active{color:var(--cream);background:#37201b;box-shadow:inset 3px 0 0 var(--red)}
    .sidebar-bottom{margin-top:auto;position:relative;z-index:1;padding:15px}
    .side-rule{height:1px;background:rgba(255,240,222,.16);margin-bottom:18px}
    .mini-demo{display:flex;align-items:center;gap:7px;text-transform:uppercase;font-size:10px;font-weight:900;letter-spacing:.11em;color:var(--gold)}
    .mini-demo:before{content:'';height:7px;width:7px;background:var(--gold);border-radius:100%;box-shadow:0 0 0 4px rgba(199,173,112,.1)}
    .side-note{font-size:11px;line-height:1.65;color:#aa9483;margin-top:9px}
    .main{flex:1;min-width:0;}
    .content{max-width:1300px;padding:32px clamp(26px,4.4vw,72px) 76px;margin:0 auto}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:3px 0 34px;border-bottom:1px solid var(--line);margin-bottom:36px}
    .breadcrumbs{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}
    .breadcrumbs b{color:var(--ink)}
    .top-right{display:flex;align-items:center;gap:18px;color:var(--muted);font-size:12px;font-weight:700}
    .today{display:flex;align-items:center;gap:9px}.today svg{color:var(--red)}
    .status-tag{padding:9px 12px;border:1px solid var(--line);background:var(--paper);border-radius:50px;color:var(--ink);font-size:10px;letter-spacing:.06em;font-weight:900;text-transform:uppercase;display:flex;align-items:center;gap:7px;white-space:nowrap}
    .status-tag i{width:7px;height:7px;border-radius:50%;background:var(--gold)}
    .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:900;color:var(--red);display:flex;gap:9px;align-items:center}
    .eyebrow:before{content:'';width:21px;height:2px;background:currentColor}
    .page-heading{font-family:var(--display);font-size:clamp(47px,5.1vw,73px);font-weight:800;line-height:.93;text-transform:uppercase;letter-spacing:-.025em;margin:13px 0 15px}
    .lede{font-size:14px;color:var(--muted);line-height:1.85;max-width:565px;margin:0}
    .hero{background:var(--ink);color:var(--cream);min-height:338px;border-radius:21px;position:relative;overflow:hidden;display:flex;align-items:center;padding:clamp(28px,4vw,60px);box-shadow:0 20px 45px rgba(26,9,5,.12)}
    .hero:after{content:'';position:absolute;right:-62px;top:-20%;height:147%;width:45%;background:var(--lupulo) right center/contain no-repeat;opacity:.50;pointer-events:none}
    .hero:before{content:'';position:absolute;right:0;top:0;bottom:0;width:47%;background:linear-gradient(90deg,var(--ink),transparent);z-index:1;pointer-events:none}
    .hero-content{position:relative;z-index:2;max-width:625px}.hero-overline{color:var(--gold);font-weight:900;letter-spacing:.19em;text-transform:uppercase;font-size:11px;display:flex;gap:12px;align-items:center}
    .hero-overline:before{content:'✦';font-size:16px}
    .hero-title{font-family:var(--display);text-transform:uppercase;letter-spacing:-.013em;font-weight:900;line-height:.89;font-size:clamp(58px,7vw,92px);margin:19px 0 20px}
    .hero-title em{color:var(--gold);font-style:normal}
    .hero-description{font-size:13px;line-height:1.8;color:#d4c4b7;margin:0 0 27px;max-width:425px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:11px;border:0;border-radius:10px;font-weight:900;font-size:13px;min-height:49px;padding:13px 19px;transition:transform .16s,filter .16s,background .16s;text-align:center;text-decoration:none}
    .btn:not(:disabled):hover{transform:translateY(-2px);filter:brightness(1.05)}.btn svg{width:17px;height:17px}
    .btn-red{color:var(--cream);background:var(--red)}.btn-dark{color:var(--cream);background:var(--ink)}
    .btn-outline{background:transparent;color:var(--ink);border:1px solid #d8c3a7}
    .btn-light{background:var(--cream);color:var(--ink)}
    .btn:disabled{background:#ded4c7!important;color:#918477!important;transform:none!important;filter:none!important;border-color:#ded4c7}

<script>
(() => {
  'use strict';
  const STORE = 'pnc-checklist-demo-v1';
  const sectors = [
    {id:'salao', title:'Salão & recepção', subtitle:'O ambiente pronto para receber', tasks:[
      {id:'mesas',title:'Mesas, cadeiras e circulação estão limpas e organizadas.',hint:'Verificar mobiliário, piso e acessos para os clientes.'},
      {id:'banheiros',title:'Banheiros higienizados e itens de uso repostos.',hint:'Conferir papel higiênico, sabonete, lixeiras e condições de limpeza.'},
      {id:'ambiente',title:'Iluminação, ventilação e música ambiente funcionando.',hint:'Garantir conforto e boa apresentação do salão.'}
    ]},
    {id:'cozinha', title:'Cozinha & segurança', subtitle:'Cuidado em cada etapa do preparo', tasks:[
      {id:'bancadas',title:'Bancadas, utensílios e equipamentos estão higienizados.',hint:'Conferir as superfícies de preparo antes do serviço.'},
      {id:'temperatura',title:'Temperaturas de geladeiras e freezers foram verificadas.',hint:'Registrar e agir conforme os padrões de controle da unidade.'},
      {id:'validade',title:'Insumos com validade, identificação e armazenamento conferidos.',hint:'Verificar integridade e condições de conservação dos alimentos.'},
      {id:'residuos',title:'Lixeiras, descarte de resíduos e sinais de pragas conferidos.',hint:'Conferir o ambiente e comunicar qualquer irregularidade.'}
    ]},
    {id:'bar', title:'Bar & atendimento', subtitle:'Tudo no ponto para o primeiro pedido', tasks:[
      {id:'barlimpo',title:'Balcão, copos e utensílios do bar estão limpos.',hint:'Checar as áreas de preparo, serviço e apoio.'},
      {id:'bebidas',title:'Bebidas, gelo e insumos do bar foram conferidos.',hint:'Identificar faltas antes do início do atendimento.'},
      {id:'sistema',title:'Sistema de pedidos e meios de pagamento testados.',hint:'Conferir acesso, operação e materiais necessários ao caixa.'}
    ]},
    {id:'equipe', title:'Equipe & operação', subtitle:'Nosso time pronto para o encontro', tasks:[
      {id:'uniformes',title:'Uniformes, apresentação e higiene da equipe conferidos.',hint:'Garantir a preparação adequada dos colaboradores.'},
      {id:'alinhamento',title:'Equipe alinhada sobre reservas, cardápio e prioridades.',hint:'Realizar orientações rápidas antes de abrir as portas.'},
      {id:'seguranca',title:'Saídas, circulações e equipamentos de emergência acessíveis.',hint:'Comunicar impedimentos ou situações de risco.'},
      {id:'estoque',title:'Estoque crítico e necessidades de reposição conferidos.',hint:'Registrar faltas para acompanhamento pela gestão.'}
    ]}
  ];
  const tasks = sectors.flatMap(s=>s.tasks);
  const total = tasks.length;
  const icons = {
    home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
    list:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 2 2 5-5"/>',
    history:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',
    arrow:'<path d="M4 12h16m-7-7 7 7-7 7"/>',
    check:'<path d="m4 12 5 5L20 6"/>',
    message:'<path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-4.1-1L3 21l1.9-5.4A9 9 0 0 1 4 11.5a8.5 8.5 0 0 1 17 0Z"/>',
    note:'<path d="M8 6h12M8 11h12M8 16h8"/><path d="M4 6h.01M4 11h.01M4 16h.01"/>',
    warn:'<path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v5m0 3h.01"/>',
    calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/>',
    shield:'<path d="m12 22 7-4V6l-7-3-7 3v12z"/><path d="m9 12 2 2 4-4"/>',
    copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',
    circle:'<circle cx="12" cy="12" r="9"/><path d="M12 8v4m0 4h.01"/>',
    edit:'<path d="M12 20h9M16 4l4 4-11 11-5 1 1-5z"/>'
  };
  const svg = (name,size=18) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.circle}</svg>`;
  const esc = v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let state={draft:null,history:[]},screen='home',expanded={},chosenHistory=null;
  try {const stored=JSON.parse(localStorage.getItem(STORE)||'null'); if(stored && typeof stored==='object') {state.draft=stored.draft||null;state.history=Array.isArray(stored.history)?stored.history:[];}}catch(e){}
  function persist(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}}
  const countDone=(draft)=>tasks.filter(t=>{let a=draft?.answers?.[t.id];return a&&(a.status==='ok'||a.status==='alert'&&a.note?.trim());}).length;
  const countAlerts=draft=>tasks.filter(t=>draft?.answers?.[t.id]?.status==='alert').length;
  const dateFmt= d=>new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'long',year:'numeric'}).format(new Date(d));
  const shortFmt=d=>new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(d));
  const timeFmt=d=>new Intl.DateTimeFormat('pt-BR',{hour:'2-digit',minute:'2-digit'}).format(new Date(d));
  function go(target){
    if(target==='check'&&!state.draft)target='home';
    screen=target;window.scrollTo({top:0,behavior:'instant'});render();
  }
  function begin(force=false){
    if(force || !state.draft){state.draft={id:Date.now(),startedAt:new Date().toISOString(),responsible:'',shift:'',answers:{}};expanded={};persist();}
    go('check');
  }
  function resetDraft(){if(!state.draft)return;if(confirm('Descartar o checklist em andamento? As marcações atuais serão perdidas.')){state.draft=null;expanded={};persist();go('home');}}
  function nav(){
    let options=[{id:'home',name:'Visão geral',ico:'home'},{id:'check',name:'Checklist',ico:'list'},{id:'history',name:'Histórico',ico:'history'}];
    document.querySelector('#desktopNav').innerHTML=options.map(o=>`<button class="nav-btn ${screen===o.id||screen==='success'&&o.id==='history'?'active':''}" data-nav="${o.id}">${svg(o.ico)} ${o.name}</button>`).join('');
    document.querySelector('#mobileNav').innerHTML=options.map(o=>`<button class="${screen===o.id||screen==='success'&&o.id==='history'?'active':''}" data-nav="${o.id}">${o.name}</button>`).join('');
    document.querySelector('#locationLabel').textContent=screen==='check'?'Checklist operacional':screen==='success'?'Checklist concluído':screen==='history'?'Histórico':'Visão geral';
    document.querySelector('#today').innerHTML=svg('calendar',15)+esc(dateFmt(new Date()));
  }
  function footer(){return `<footer class="note-band"><span><b>PRAÇA NOSSO CHURRAS</b> · Rotina em dia</span><span>Protótipo ilustrativo · Nenhuma integração ativa</span></footer>`;}
  function home(){
    let hasDraft=!!state.draft,done=hasDraft?countDone(state.draft):0;
    return `<section aria-label="Boas-vindas">
      <div class="hero"><div class="hero-content">
        <div class="hero-overline">Nosso cuidado começa aqui</div>
        <h1 class="hero-title">A casa pronta.<br><em>O encontro</em><br>acontece.</h1>
        <p class="hero-description">Cada detalhe faz parte da experiência. Organize a rotina da equipe e comece o dia com tudo no ponto.</p>
        <button class="btn btn-red" data-action="start">${hasDraft?'Continuar checklist':'Iniciar checklist'} ${svg('arrow')}</button>
      </div></div>
      <div class="stats-grid">
        <div class="stat"><span class="stat-label">Checklist ativo</span><div class="stat-value">${hasDraft?'01':'00'}</div><div class="stat-hint">${hasDraft?'Rotina em andamento':'Pronto para iniciar'}</div></div>
        <div class="stat"><span class="stat-label">Itens de verificação</span><div class="stat-value">${total.toString().padStart(2,'0')}</div><div class="stat-hint">Etapas da operação</div></div>
        <div class="stat"><span class="stat-label">Áreas monitoradas</span><div class="stat-value">04</div><div class="stat-hint">Salão, cozinha, bar e equipe</div></div>
        <div class="stat"><span class="stat-label">Conclusão obrigatória</span><div class="stat-value">100<small>%</small></div><div class="stat-hint">Nenhuma etapa fica para trás</div></div>
      </div>
      ${hasDraft?`<div class="section-heading"><div><h2>Você tem uma rotina em andamento</h2><p>${done} de ${total} itens finalizados · Seus dados estão salvos neste navegador.</p></div><button class="btn btn-outline" data-action="start">Continuar ${svg('arrow')}</button></div>`:`<div class="section-heading"><div><h2>Uma operação bem cuidada</h2><p>Da primeira conferência ao momento de abrir as portas.</p></div><div class="small-caption">NOSSO padrão</div></div>`}
      <div class="preview-grid">
        <article class="preview-card"><div class="preview-icon">${svg('list',21)}</div><h3>Conferência completa</h3><p>Uma sequência simples de verificações, organizada por área de trabalho.</p></article>
        <article class="preview-card"><div class="preview-icon">${svg('edit',21)}</div><h3>Registro de ocorrências</h3><p>Identifique pontos de atenção e detalhe o que aconteceu em cada item.</p></article>
        <article class="preview-card"><div class="preview-icon">${svg('message',21)}</div><h3>Visão para a gestão</h3><p>Ao concluir, visualize como o resumo chegaria ao responsável via WhatsApp.</p></article>
      </div>${footer()}</section>`;
  }
  function itemView(task,n){
    const a=state.draft.answers[task.id]||{status:null,note:''};const done=a.status==='ok'||a.status==='alert'&&a.note?.trim();const isOpen=expanded[task.id]||a.status==='alert';
    return `<div class="task-item" id="task-${task.id}">
      <div class="task-main"><div class="task-check ${done?a.status==='ok'?'ok':'attention':''}">${done?svg('check',16):String(n+1).padStart(2,'0')}</div><div class="task-body"><h3 class="task-title">${esc(task.title)}</h3><p class="task-hint">${esc(task.hint)}</p></div></div>
      <div class="task-actions" role="group" aria-label="Avaliação: ${esc(task.title)}">
        <button class="choice ${a.status==='ok'?'is-ok':''}" data-status="ok" data-task="${task.id}" aria-pressed="${a.status==='ok'}">${svg('check',14)} Conforme</button>
        <button class="choice ${a.status==='alert'?'is-attention':''}" data-status="alert" data-task="${task.id}" aria-pressed="${a.status==='alert'}">${svg('warn',14)} Precisa de atenção</button>
        <button class="observation-toggle" data-expand="${task.id}" aria-expanded="${!!isOpen}">${svg('note',14)} ${isOpen?'Ocultar observação':(a.note?'Editar observação':'Adicionar observação')}</button>
      </div>
      ${isOpen?`<div class="observation-area"><label class="field-label" for="note-${task.id}">Observação ${a.status==='alert'?'* Obrigatória para pontos de atenção':'(opcional)'}</label><textarea class="field-input" data-note-for="${task.id}" id="note-${task.id}" maxlength="700" placeholder="Descreva o que foi encontrado, providências tomadas ou o que precisa ser resolvido...">${esc(a.note)}</textarea>${a.status==='alert'&&!a.note?.trim()?`<p class="help-error">${svg('warn',13)} Descreva a ocorrência para concluir este item.</p>`:''}</div>`:''}
    </div>`;
  }
  function check(){
    let d=state.draft;if(!d)return home();let done=countDone(d),alerts=countAlerts(d),pending=total-done;
    return `<section>
      <div class="check-intro"><div><div class="eyebrow">Operação / Rotina diária</div><h1 class="page-heading">Checklist de abertura</h1><p class="lede">Confira cada etapa do turno. Marque como <b>Conforme</b> ou <b>Precisa de atenção</b> e registre as ocorrências para a gestão acompanhar.</p></div><button class="text-button" data-action="reset">Descartar checklist</button></div>
      <div class="progress-banner"><div class="progress-banner-copy"><div class="progress-banner-top"><span>Seu progresso</span><strong id="progress-count">${done} de ${total} concluídos</strong></div><div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}" aria-label="Progresso do checklist"><div class="progress-fill" style="width:${Math.round(done/total*100)}%"></div></div><div class="progress-desc" id="progress-desc">${pending?'Faltam '+pending+' avaliações para finalizar.':'Todos os itens foram avaliados. Revise os dados do responsável.'}</div></div></div>
      <div class="check-layout">
        <div class="check-sections">${sectors.map((s,i)=>{
          let count=s.tasks.filter(t=>{let a=d.answers[t.id];return a&&(a.status==='ok'||a.status==='alert'&&a.note?.trim());}).length;
          return `<section class="section-box" aria-labelledby="sector-${s.id}"><div class="section-top"><div class="section-top-left"><span class="section-num">0${i+1}</span><div><h2 id="sector-${s.id}">${esc(s.title)}</h2><p>${esc(s.subtitle)}</p></div></div><span class="section-count" id="sectorcount-${s.id}">${count}/${s.tasks.length} verificados</span></div>${s.tasks.map((t,j)=>itemView(t,tasks.findIndex(x=>x.id===t.id))).join('')}</section>`;
        }).join('')}</div>
        <aside class="sidepanel" aria-label="Dados do checklist"><div class="aside-card">
          <span class="aside-eyebrow">Dados do turno</span><h3>Quem está conferindo?</h3>
          <div class="field-group"><label class="field-label" for="responsible">Nome do responsável *</label><input class="field-input" id="responsible" maxlength="70" placeholder="Ex.: Maria Silva" value="${esc(d.responsible)}" autocomplete="name"></div>
          <div class="field-group"><label class="field-label" for="shift">Turno *</label><div class="select-wrap"><select class="field-input" id="shift"><option value="">Selecione o turno</option>${['Manhã','Tarde','Noite'].map(s=>`<option ${d.shift===s?'selected':''}>${s}</option>`).join('')}</select></div></div>
          <p class="aside-detail">Essas informações aparecem no resumo demonstrativo enviado à gestão.</p>
          <div class="aside-sum"><div class="sum-line"><span>Itens concluídos</span><strong id="sum-done">${done} / ${total}</strong></div><div class="sum-line"><span>Ocorrências marcadas</span><strong id="sum-alerts">${alerts}</strong></div><div class="sum-line"><span>Pendências</span><strong id="sum-pending">${pending}</strong></div></div>
          <div class="finish-wrap"><button class="btn btn-red" id="finishButton" data-action="finish" ${pending||!d.responsible.trim()||!d.shift?'disabled':''}>Finalizar checklist ${svg('arrow')}</button><p class="finish-help" id="finishHelp">${finishHelp(d)}</p></div>
        </div><div class="hint-card"><div class="hint-card-title">${svg('shield',18)} Regra importante</div><p>É necessário avaliar <b>todos os ${total} itens</b> para concluir. Uma ocorrência não impede a finalização, mas exige uma observação.</p></div></aside>
      </div>${footer()}
    </section>`;
  }
  function finishHelp(d){
    let pending=total-countDone(d);
    if(pending)return `Avalie os ${pending} item${pending===1?'':'s'} restante${pending===1?'':'s'} para liberar a finalização.`;
    if(!d.responsible.trim()||!d.shift)return 'Informe o responsável e o turno para liberar a finalização.';
    return 'Tudo certo! O checklist já pode ser finalizado.';
  }
  function updateFinish(){
    let d=state.draft;if(!d||screen!=='check')return;
    let done=countDone(d),alert=countAlerts(d),pending=total-done;
    const setText=(id,v)=>{let e=document.getElementById(id);if(e)e.textContent=v;};
    setText('progress-count',`${done} de ${total} concluídos`);
    setText('progress-desc',pending?`Faltam ${pending} avaliações para finalizar.`:'Todos os itens foram avaliados. Revise os dados do responsável.');
    setText('sum-done',`${done} / ${total}`);setText('sum-alerts',alert);setText('sum-pending',pending);setText('finishHelp',finishHelp(d));
    let fill=document.querySelector('.progress-fill');if(fill)fill.style.width=(done/total*100)+'%';
    let bar=document.querySelector('[role="progressbar"]');if(bar)bar.setAttribute('aria-valuenow',done);
    let b=document.getElementById('finishButton');if(b)b.disabled=!!(pending||!d.responsible.trim()||!d.shift);
    sectors.forEach(s=>setText('sectorcount-'+s.id,`${s.tasks.filter(t=>{let a=d.answers[t.id];return a&&(a.status==='ok'||a.status==='alert'&&a.note?.trim());}).length}/${s.tasks.length} verificados`));
  }
  function messageText(record){
    const warnings=tasks.filter(t=>record.answers[t.id]?.status==='alert');
    const observations=tasks.filter(t=>record.answers[t.id]?.note?.trim());
    return `*PRAÇA NOSSO CHURRAS* 🔥\n*RELATÓRIO DE CHECKLIST*\n\n📋 Checklist de abertura\n👤 Responsável: ${record.responsible}\n🕒 Turno: ${record.shift}\n📅 Concluído: ${shortFmt(record.completedAt)}\n\n✅ Itens verificados: ${total}/${total}\n⚠️ Pontos de atenção: ${warnings.length}\n\n*OBSERVAÇÕES DA EQUIPE*\n${observations.length?observations.map((t,i)=>`${i+1}. ${t.title}\n   ${record.answers[t.id]?.status==='alert'?'⚠️ Atenção':'✅ Conforme'} — ${record.answers[t.id].note.trim()}`).join('\n\n'):'Nenhuma observação registrada.'}\n\n${warnings.length?'🔔 Existem ocorrências para acompanhamento.':'✅ Todas as verificações foram marcadas como conformes.'}\n\n— NOSSO ponto de encontro. Seu churrasco favorito.`;
  }
  function record(){return chosenHistory ? state.history.find(r=>r.id===chosenHistory) : state.history[0];}
  function success(){
    const r=record();if(!r)return history();let alerts=countAlerts(r),isHistoric=!!chosenHistory;
    return `<section>
      <div class="success-hero"><div class="success-medal">${svg('check',36)}</div><div class="success-copy"><div class="eyebrow">Conferência finalizada</div><h1>Checklist concluído!</h1><p>${total} itens verificados. ${alerts?`${alerts} ocorrência${alerts===1?'':'s'} registrada${alerts===1?'':'s'} para acompanhamento.`:'Tudo conferido e nenhuma ocorrência sinalizada.'}</p></div></div>
      <div class="section-heading"><div><h2>Assim a gestão recebe as informações</h2><p>Exemplo da atualização que seria encaminhada automaticamente ao responsável.</p></div><span class="small-caption">Prévia da notificação</span></div>
      <div class="demo-alert">${svg('circle',18)} <span><strong>Esta é uma simulação.</strong> O status e a mensagem abaixo representam o envio por WhatsApp. Nenhuma mensagem real foi enviada e não existe integração ativa.</span></div>
      <div class="success-grid"><div class="message-card"><div class="message-top"><div class="message-top-left"><div class="message-icon">${svg('message',20)}</div><div><strong>Atualização via WhatsApp</strong><small>Envio concluído · demonstração visual</small></div></div><span class="demo-chip">Simulado</span></div>
        <div class="message-body"><div class="message-bubble"><h3>Mensagem para a gestão</h3><div class="message-text" id="messageText">${esc(messageText(r))}</div></div></div>
        <div class="message-footer"><span class="small-caption">Resumo pronto para compartilhar</span><button class="btn btn-outline" data-action="copy">${svg('copy',16)} Copiar mensagem</button></div></div>
        <aside class="result-card"><h3>Resumo do registro</h3><div class="result-row"><small>Responsável</small><strong>${esc(r.responsible)}</strong></div><div class="result-row"><small>Turno</small><strong>${esc(r.shift)}</strong></div><div class="result-row"><small>Data e horário</small><strong>${shortFmt(r.completedAt)}</strong></div><div class="result-row"><small>Itens concluídos</small><strong>${total} de ${total} (${Math.round(100)}%)</strong></div><div class="result-row"><small>Pontos de atenção</small><strong>${alerts}</strong></div><div class="result-actions"><button class="btn btn-red" data-action="new">Novo checklist ${svg('arrow')}</button><button class="btn btn-outline" data-nav="history">Ver histórico</button></div></aside>
      </div>${footer()}
    </section>`;
  }
  function history(){
    return `<section><div class="historic-header"><div class="eyebrow">Gestão / Registros</div><h1 class="page-heading">Histórico</h1><p class="lede">Acompanhe os checklists finalizados nesta demonstração. Os dados ficam armazenados somente neste navegador.</p></div>
      ${state.history.length?`<div class="history-list">${state.history.map((r,i)=>`<button class="history-card" data-history="${r.id}"><span class="history-no">${String(i+1).padStart(2,'0')}</span><div class="history-main"><strong>Checklist de abertura · ${esc(r.responsible)}</strong><small>${shortFmt(r.completedAt)} · Turno ${esc(r.shift)}</small></div><div class="history-stat">${total}/${total} itens<br>${countAlerts(r)} ocorrência(s)</div><span class="history-arrow">${svg('arrow',19)}</span></button>`).join('')}</div>`:`<div class="empty-history"><div class="empty-history-icon">${svg('history',26)}</div><h2>Seu histórico começa aqui</h2><p>Depois de finalizar a primeira conferência, o registro aparecerá nesta área para consulta.</p><button class="btn btn-red" data-action="start">Iniciar checklist ${svg('arrow')}</button></div>`}
      ${footer()}</section>`;
  }
  function render(){
    nav();let el=document.getElementById('screen');el.innerHTML=screen==='check'?check():screen==='history'?history():screen==='success'?success():home();
  }
  function finish(){
    let d=state.draft;if(!d)return;
    if(countDone(d)!==total||!d.responsible.trim()||!d.shift){updateFinish();return;}
    let rec={...d, responsible:d.responsible.trim(),completedAt:new Date().toISOString()};
    state.history.unshift(rec);state.history=state.history.slice(0,20);state.draft=null;chosenHistory=null;persist();go('success');
  }
  function safeCopy(str){
    if(navigator.clipboard?.writeText){return navigator.clipboard.writeText(str).catch(()=>fallbackCopy(str));}
    return fallbackCopy(str);
  }
  function fallbackCopy(str){const el=document.createElement('textarea');el.value=str;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();try{document.execCommand('copy');}finally{el.remove();}}
  document.addEventListener('click',e=>{
    let navb=e.target.closest('[data-nav]');if(navb){chosenHistory=null;go(navb.dataset.nav);return;}
    let hist=e.target.closest('[data-history]');if(hist){chosenHistory=Number(hist.dataset.history);go('success');return;}
    let action=e.target.closest('[data-action]');if(action){const a=action.dataset.action;
      if(a==='start')begin();else if(a==='reset')resetDraft();else if(a==='finish')finish();else if(a==='new'){chosenHistory=null;begin(true);}
      else if(a==='copy'){const r=record();if(r){Promise.resolve(safeCopy(messageText(r))).then(()=>{let before=action.innerHTML;action.textContent='Mensagem copiada!';setTimeout(()=>action.innerHTML=before,1800);}).catch(()=>{action.textContent='Não foi possível copiar';});}}
      return;
    }
    let mark=e.target.closest('[data-status]');if(mark&&state.draft){const id=mark.dataset.task,status=mark.dataset.status;
      const old=state.draft.answers[id]||{status:null,note:''};old.status=old.status===status?null:status;state.draft.answers[id]=old;if(status==='alert')expanded[id]=true;persist();render();
      if(old.status==='alert'){document.querySelector(`[data-note-for="${id}"]`)?.focus({preventScroll:true});}
      return;}
    let expand=e.target.closest('[data-expand]');if(expand&&state.draft){const id=expand.dataset.expand;let a=state.draft.answers[id];if(a?.status==='alert'&&expanded[id]){expanded[id]=false;/* point of attention always keeps note field visible */}
      else expanded[id]=!expanded[id];render();document.getElementById('task-'+id)?.scrollIntoView({block:'nearest'});return;}
  });
  document.addEventListener('input',e=>{
    if(!state.draft)return;
    if(e.target.matches('[data-note-for]')){const id=e.target.dataset.noteFor;let a=state.draft.answers[id]||{status:null,note:''};a.note=e.target.value;state.draft.answers[id]=a;persist();
      const item=e.target.closest('.task-item');const checked=a.status==='ok'||a.status==='alert'&&a.note.trim();let icon=item?.querySelector('.task-check');if(icon){icon.className='task-check '+(checked?a.status==='ok'?'ok':'attention':'');icon.innerHTML=checked?svg('check',16):String(tasks.findIndex(t=>t.id===id)+1).padStart(2,'0');}
      let error=item?.querySelector('.help-error');if(error)error.style.display= a.status==='alert'&&!a.note.trim()?'flex':'none';updateFinish();
    }
    if(e.target.id==='responsible'){state.draft.responsible=e.target.value;persist();updateFinish();}
  });
  document.addEventListener('change',e=>{
    if(!state.draft)return;
    if(e.target.id==='shift'){state.draft.shift=e.target.value;persist();updateFinish();}
  });
  render();
})();
</script>
</body>
</html>
